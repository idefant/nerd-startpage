name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Firefox
        run: task build-firefox

      - name: Build Chrome
        run: task build-chrome

      - name: Sign Firefox extension
        run: |
          npx web-ext sign \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --channel=unlisted \
            --source-dir=dist-firefox/ \
            --artifacts-dir=build-firefox/

      - name: Package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cd dist-chrome && zip -r "../nerd-startpage-chrome-${VERSION}.zip" . && cd ..
          XPI_FILE=$(find build-firefox -name "*.xpi" | head -n 1)
          mv "$XPI_FILE" "nerd-startpage-firefox-${VERSION}.xpi"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          files: |
            nerd-startpage-chrome-${{ github.ref_name }}.zip
            nerd-startpage-firefox-${{ github.ref_name }}.xpi
